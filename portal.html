<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --bg: #F3F5F8;
    --surface: #FFFFFF;
    --ink: #172033;
    --muted: #5F6B7C;
    --line: #E1E6ED;
    --line-strong: #C9D1DB;
    --brand: #0F4C81;
    --brand-soft: #E4EEF7;
    --brand-ink: #FFFFFF;
    --accent: #F2B705;
    --tile: #F7F9FB;
    --shadow: 0 1px 2px rgba(23, 32, 51, 0.06), 0 8px 24px rgba(23, 32, 51, 0.08);
    --font: "Plus Jakarta Sans", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0F141B;
      --surface: #171E27;
      --ink: #EDF1F6;
      --muted: #98A4B3;
      --line: #263040;
      --line-strong: #364457;
      --brand: #5B9BD5;
      --brand-soft: #1B2D40;
      --brand-ink: #0B1220;
      --accent: #F2B705;
      --tile: #1F2834;
      --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 8px 24px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0F141B;
    --surface: #171E27;
    --ink: #EDF1F6;
    --muted: #98A4B3;
    --line: #263040;
    --line-strong: #364457;
    --brand: #5B9BD5;
    --brand-soft: #1B2D40;
    --brand-ink: #0B1220;
    --accent: #F2B705;
    --tile: #1F2834;
    --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 8px 24px rgba(0,0,0,0.35);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: inherit; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  button, input { font: inherit; color: inherit; }
  img { max-width: 100%; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

  .page { max-width: 1120px; margin: 0 auto; padding: 20px 20px 64px; }

  .top { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; min-width: 0; }
  .top .brand { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px; flex: none;
    height: 38px; padding: 0 14px; border-radius: 10px;
    border: 1px solid var(--line-strong); background: var(--surface);
    cursor: pointer; font-weight: 600; font-size: 14px; white-space: nowrap;
  }
  .btn:hover { border-color: var(--brand); color: var(--brand); }
  a.btn { text-decoration: none; margin-right: 8px; }
  .btn[hidden] { display: none; }
  .btn svg { width: 16px; height: 16px; }
  @media (max-width: 480px) { .btn span { display: none; } .btn { padding: 0 11px; } }
  .mark {
    width: 44px; height: 44px; flex: none; border-radius: 12px;
    background: var(--brand); color: var(--brand-ink);
    display: grid; place-items: center; overflow: hidden;
  }
  .mark img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .mark.has-logo { background: transparent; }
  .top h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.2; }
  .top p { margin: 2px 0 0; color: var(--muted); font-size: 13.5px; }

  .search { position: relative; margin-bottom: 20px; }
  .search svg {
    position: absolute; left: 18px; top: 50%; transform: translateY(-50%);
    width: 22px; height: 22px; color: var(--muted); pointer-events: none;
  }
  .search input {
    width: 100%; height: 60px; padding: 0 88px 0 54px;
    border-radius: 16px; border: 1px solid var(--line);
    background: var(--surface); font-size: 17px; box-shadow: var(--shadow);
  }
  .search input::placeholder { color: var(--muted); }
  .search input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 4px var(--brand-soft), var(--shadow); }
  .search input::-webkit-search-cancel-button { -webkit-appearance: none; }
  .search kbd {
    position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
    font-family: var(--font); font-size: 12px; color: var(--muted);
    border: 1px solid var(--line-strong); border-radius: 6px; padding: 2px 7px; background: var(--tile);
  }
  .search .clear {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    width: 36px; height: 36px; border-radius: 50%; border: 0;
    background: var(--tile); color: var(--muted); cursor: pointer;
    display: none; place-items: center;
  }
  .search.has-query kbd { display: none; }
  .search.has-query .clear { display: grid; }

  .tabs {
    display: flex; gap: 4px; border-bottom: 1px solid var(--line);
    margin-bottom: 24px; overflow-x: auto; scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: none; border: 0; background: none; cursor: pointer;
    padding: 10px 12px 12px; font-weight: 600; font-size: 14px; color: var(--muted);
    border-bottom: 2px solid transparent; margin-bottom: -1px;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .tab .n { font-weight: 500; font-size: 12.5px; opacity: .85; }
  .tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--brand); }
  .tab:hover { color: var(--ink); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px 8px; }
  @media (max-width: 480px) { .grid { grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); } }
  .tile {
    position: relative; display: flex; flex-direction: column; align-items: center; gap: 10px;
    padding: 18px 8px 14px; border-radius: 16px; text-decoration: none; text-align: center;
    cursor: pointer; border: 1px solid transparent; background: transparent; width: 100%;
  }
  .tile:hover, .tile:focus-visible { background: var(--surface); border-color: var(--line); }
  .tile.no-url { cursor: default; }
  .icon {
    width: 76px; height: 76px; border-radius: 20px; display: grid; place-items: center; overflow: hidden;
    background: var(--tile); color: #fff; font-weight: 700; font-size: 26px; letter-spacing: 0.02em;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.04);
  }
  .icon.emoji { font-size: 38px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
  .icon.img { background: #fff; box-shadow: inset 0 0 0 1px var(--line); }
  .icon img { width: 100%; height: 100%; object-fit: contain; padding: 8px; display: block; background: #fff; }
  .name {
    font-size: 13.5px; font-weight: 600; line-height: 1.3; max-width: 100%;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word;
  }
  .tile.no-url .name { color: var(--muted); }
  .desc {
    font-size: 12px; color: var(--muted); line-height: 1.3; margin-top: -4px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  @media (max-width: 480px) {
    .icon { width: 60px; height: 60px; border-radius: 16px; font-size: 21px; }
    .icon.emoji { font-size: 30px; }
    .tile { padding: 14px 4px 10px; }
    .name { font-size: 12.5px; }
    .desc { display: none; }
  }
  .star {
    position: absolute; top: 8px; right: 8px; width: 30px; height: 30px; border-radius: 50%;
    border: 0; background: transparent; cursor: pointer; display: grid; place-items: center;
    color: var(--line-strong); opacity: 0;
  }
  .star svg { width: 18px; height: 18px; }
  .tile:hover .star, .tile:focus-within .star, .star.on { opacity: 1; }
  .star.on { color: var(--accent); }
  .star:hover { background: var(--tile); color: var(--accent); }
  @media (hover: none) { .star { opacity: 1; } }

  .empty { grid-column: 1 / -1; text-align: center; padding: 56px 16px; color: var(--muted); }
  .empty strong { display: block; color: var(--ink); font-size: 16px; margin-bottom: 4px; }
  .empty code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; }

  .foot { margin: 36px 0 0; font-size: 12.5px; color: var(--muted); text-align: center; }

  .toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%) translateY(16px);
    background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px;
    font-size: 14px; font-weight: 500; opacity: 0; pointer-events: none;

<script>
(async () => {
  'use strict';

  // ---------- buka data ----------
  const C = window.PortalCrypto;
  let portal = null;
  if (C && C.supported && window.PORTAL_DATA) {
    let hadKey = false;
    try {
      const key = await C.loadKey();
      if (key) { hadKey = true; portal = await C.decryptWithKey(key, window.PORTAL_DATA); }
    } catch { portal = null; }
    if (!portal) { C.clearKey(); location.replace(hadKey ? 'index.html#kode-berubah' : 'index.html'); return; }
  } else {
    location.replace('index.html'); return;
  }
  // Tombol "Kelola" hanya untuk yang masuk dengan kode kelola
  if (C.loadRole() === 'kelola') document.getElementById('manage').hidden = false;
  window.PORTAL_CONFIG = portal.config || {};
  window.PORTAL_APPS = Array.isArray(portal.apps) ? portal.apps : [];

  const $ = (id) => document.getElementById(id);
  const grid = $('grid'), tabs = $('tabs'), search = $('search'), searchWrap = $('searchWrap');
  const PALETTE = ['#0F4C81', '#1F6F8B', '#0B7A75', '#3A6B35', '#8A4F1D', '#7A3E9D', '#A63A50', '#3D4F70'];

  const config = Object.assign({ title: 'Portal Aplikasi', subtitle: '', logo: '', footer: '' }, window.PORTAL_CONFIG || {});
  const state = { apps: [], query: '', tab: 'all', favs: new Set(), ok: true };

  // ---------- helpers ----------
  function el(tag, attrs = {}, ...children) {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === 'class') n.className = v;
      else if (k === 'text') n.textContent = v;
      else if (k === 'html') n.innerHTML = v;      // only for the inline SVG icons below
      else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? '' : v);
    }
    for (const c of children) if (c != null) n.append(c);
    return n;
  }
  const STAR = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="m12 2.5 2.9 6.2 6.8.8-5 4.7 1.3 6.8L12 17.6 6 21l1.3-6.8-5-4.7 6.8-.8Z"/></svg>';

  function slug(s) {
    return String(s || '').toLowerCase().normalize('NFKD').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'app';
  }
  function initials(name) {
    const words = String(name || '').trim().split(/[\s\-_/]+/).filter(Boolean);
    if (!words.length) return '?';
    if (words.length === 1) return words[0].slice(0, 2).toUpperCase();
    return (words[0][0] + words[1][0]).toUpperCase();
  }
  function colorFor(name) {
    let h = 0;
    for (const ch of String(name)) h = (h * 31 + ch.codePointAt(0)) >>> 0;
    return PALETTE[h % PALETTE.length];
  }
  function isImagePath(v) {
    return /^(https?:\/\/|data:image\/|\.{0,2}\/)/i.test(v) || /\.(png|jpe?g|svg|webp|gif|ico)(\?.*)?$/i.test(v) || /^[\w.-]+\/[\w.\/-]+$/.test(v);
  }
  function iconNode(app) {
    const v = String(app.icon || '').trim();
    if (v && isImagePath(v)) {
      const img = el('img', { alt: '', src: v, loading: 'lazy' });
      const box = el('div', { class: 'icon img' }, img);
      img.addEventListener('error', () => { box.replaceWith(autoIcon(app)); }, { once: true });
      return box;
    }
    if (v) return el('div', { class: 'icon emoji', text: v });
    return autoIcon(app);
  }
  function autoIcon(app) {
    const n = el('div', { class: 'icon', text: initials(app.name) });
    n.style.background = colorFor(app.name);
    return n;
  }
  function normalizeUrl(raw) {
    let v = String(raw || '').trim();
    if (!v) return '';
    if (!/^[a-z][a-z0-9+.-]*:/i.test(v)) v = 'https://' + v;
    return v;
  }
  function toast(msg) {
    const t = $('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2400);
  }

  // ---------- favorites (tersimpan di browser masing-masing) ----------
  function loadFavs() {
    try { const raw = localStorage.getItem('portal-favs'); if (raw) state.favs = new Set(JSON.parse(raw)); }
    catch { state.favs = new Set(); }
  }
  function saveFavs() { try { localStorage.setItem('portal-favs', JSON.stringify([...state.favs])); } catch {} }
  function toggleFav(id) {
    if (state.favs.has(id)) state.favs.delete(id); else state.favs.add(id);
    saveFavs(); render();
  }

  // ---------- data ----------
  function loadApps() {
    if (!state.ok) return;
    const seen = new Map();
    state.apps = window.PORTAL_APPS
      .filter(a => a && String(a.name || '').trim())
      .map(a => {
        const name = String(a.name).trim();
        let id = slug(name);
        const n = (seen.get(id) || 0) + 1; seen.set(id, n);
        if (n > 1) id += '-' + n;
        return { id, name, url: normalizeUrl(a.url), category: String(a.category || '').trim(), desc: String(a.desc || '').trim(), icon: a.icon || '' };
      });
  }
  function categories() {
    const set = new Set();
    for (const a of state.apps) if (a.category) set.add(a.category);
    return [...set].sort((a, b) => a.localeCompare(b, 'id'));
  }
  function visibleApps() {
    const q = state.query.trim().toLowerCase();
    return state.apps
      .filter(a => {
        if (state.tab === 'fav' && !state.favs.has(a.id)) return false;
        if (state.tab !== 'all' && state.tab !== 'fav' && a.category !== state.tab) return false;
        if (!q) return true;
        return [a.name, a.desc, a.category].some(v => String(v || '').toLowerCase().includes(q));
      })
      .sort((a, b) => a.name.localeCompare(b.name, 'id', { sensitivity: 'base' }));
  }

  // ---------- render ----------
  function render() {
    searchWrap.classList.toggle('has-query', !!state.query);

    const cats = categories();
    if (state.tab !== 'all' && state.tab !== 'fav' && !cats.includes(state.tab)) state.tab = 'all';
    tabs.textContent = '';
    const mk = (key, label, count) => el('button', {
      class: 'tab', role: 'tab', 'aria-selected': String(state.tab === key),
      onclick: () => { state.tab = key; render(); }
    }, label, el('span', { class: 'n', text: String(count) }));
    tabs.append(mk('all', 'Semua', state.apps.length));
    tabs.append(mk('fav', 'Favorit', state.apps.filter(a => state.favs.has(a.id)).length));
    for (const c of cats) tabs.append(mk(c, c, state.apps.filter(a => a.category === c).length));

    grid.textContent = '';
    if (!state.ok) {
      grid.append(el('div', { class: 'empty' },
        el('strong', { text: 'Daftar aplikasi tidak bisa dibaca' }),
        'Buat ulang ', el('code', { text: 'data.enc.js' }), ' lewat ', el('code', { text: 'admin.html' }), '.'));
      return;
    }
    if (!state.apps.length) {
      grid.append(el('div', { class: 'empty' },
        el('strong', { text: 'Belum ada aplikasi' }),
        'Pengelola portal belum menambahkan aplikasi. Daftar diatur lewat ', el('code', { text: 'admin.html' }), '.'));
      return;
    }
    const list = visibleApps();
    if (!list.length) {
      const msg = state.tab === 'fav' && !state.query
        ? ['Belum ada favorit', 'Tandai bintang pada aplikasi yang sering Anda pakai agar muncul di sini.']
        : ['Tidak ada yang cocok', `Tidak ada aplikasi yang cocok dengan “${state.query.trim()}”${state.tab !== 'all' ? ' di tab ini' : ''}.`];
      grid.append(el('div', { class: 'empty' }, el('strong', { text: msg[0] }), msg[1]));
    }
    for (const app of list) grid.append(tile(app));
  }

  function tile(app) {
    const fav = state.favs.has(app.id);
    const kids = [
      iconNode(app),
      el('div', { class: 'name', text: app.name }),
      app.desc ? el('div', { class: 'desc', text: app.desc }) : null,
      el('button', {
        class: 'star' + (fav ? ' on' : ''), type: 'button', html: STAR,
        'aria-label': fav ? 'Hapus dari favorit' : 'Tandai favorit', 'aria-pressed': String(fav),
        onclick: (e) => { e.preventDefault(); e.stopPropagation(); toggleFav(app.id); }
      }),
    ];
    if (app.url) {
      return el('a', { class: 'tile', href: app.url, target: '_blank', rel: 'noopener noreferrer', title: app.url }, ...kids);
    }
    return el('div', { class: 'tile no-url', role: 'button', tabindex: '0',
      onclick: () => toast('Alamat aplikasi ini belum tersedia.'),
      onkeydown: (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toast('Alamat aplikasi ini belum tersedia.'); } } }, ...kids);
  }

  // ---------- search & shortcuts ----------
  search.addEventListener('input', () => { state.query = search.value; render(); });
  $('clear').addEventListener('click', () => { search.value = ''; state.query = ''; render(); search.focus(); });
  document.addEventListener('keydown', (e) => {
    const tag = (e.target.tagName || '').toLowerCase();
    const typing = tag === 'input' || tag === 'textarea' || e.target.isContentEditable;
    if (e.key === '/' && !typing) { e.preventDefault(); search.focus(); search.select(); }
    if (e.key === 'Escape' && document.activeElement === search && search.value) { search.value = ''; state.query = ''; render(); }
  });

  document.title = config.title || document.title;
  $('title').textContent = config.title || 'Portal Aplikasi';
  $('subtitle').textContent = config.subtitle || '';
  $('subtitle').hidden = !config.subtitle;
  $('foot').textContent = config.footer || '';
